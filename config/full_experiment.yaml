# Full-scale configuration for reproduction of main results
run_name: iteration9/full_experiment
seed: 42

teacher:
  model_name: "microsoft/DialoGPT-medium"
  layers_to_sketch: [4, 8, 12, 16, 20]

student:
  model_name: "distilbert-base-uncased"
  projection_dim: 128

vpq_as:
  sketch_dim: 64
  num_pq_groups: 4
  beta: 0.25

data:
  dataset_name: "glue"
  subset: "all"
  max_samples: 10000

training:
  epochs: 3
  batch_size: 32
  lr: 0.0002
  max_steps: 1000

evaluation:
  batch_size: 64
  max_samples: 2000

federated:
  num_clients: 10
  local_epochs: 2
  communication_rounds: 2
