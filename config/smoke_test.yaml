# Lightweight configuration file for quick CI smoke-tests
run_name: iteration7/smoke_test
seed: 123

teacher:
  model_name: "microsoft/DialoGPT-small"
  layers_to_sketch: [2, 4]

student:
  model_name: "distilbert-base-uncased"
  projection_dim: 32

vpq_as:
  sketch_dim: 32
  num_pq_groups: 2
  beta: 0.25

data:
  dataset_name: "glue"
  subset: "sst2"
  max_samples: 100

training:
  epochs: 1
  batch_size: 8
  lr: 0.0001
  max_steps: 10

evaluation:
  batch_size: 16
  max_samples: 50
