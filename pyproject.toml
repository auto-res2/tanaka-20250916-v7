[project]
name = "ais_kd_project"
version = "0.1.0"
description = "Refactored AIS-KD experimental code-base"
authors = ["ML Researcher <research@example.com>"]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]

dependencies = [
  "torch>=2.0.0",
  "transformers>=4.30.0",
  "datasets>=2.12.0",
  "accelerate>=0.20.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.12.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
all = []
